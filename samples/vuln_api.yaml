# Intentionally flawed sample API for local testing only.
openapi: 3.0.3
info: {title: VulnShop, version: 0.1.0}
servers: [{url: http://localhost:8080/api}]
security: [{bearerAuth: []}]
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
    apiKey: {type: apiKey, in: header, name: X-API-Key}
  parameters:
    UserId: {name: userId, in: path, required: true, schema: {type: integer}}
  schemas:
    User:
      type: object
      properties:
        id: {type: integer}
        email: {type: string}
        password_hash: {type: string}   # excessive data exposure
        is_admin: {type: boolean}       # mass-assignment candidate
        manager: {$ref: '#/components/schemas/User'}  # circular ref
    Order:
      type: object
      properties: {id: {type: integer}, userId: {type: integer}, total: {type: number}}
paths:
  /login:
    post:
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, properties: {email: {type: string}, password: {type: string}}}
      responses: {'200': {description: token}, '401': {description: bad creds}}
  /users/{userId}:
    parameters: [{$ref: '#/components/parameters/UserId'}]
    get:
      summary: Get user by id (no ownership check)
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
    put:
      summary: Update user (accepts is_admin)
      requestBody:
        content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}
      responses: {'200': {description: ok}}
  /orders:
    get:
      summary: List orders
      parameters:
        - {name: limit, in: query, schema: {type: integer}}
        - {name: userId, in: query, schema: {type: integer}}
      responses:
        '200': {description: ok, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Order'}}}}}
  /admin/users:
    delete:
      summary: Delete all users (unauthenticated!)
      security: []
      responses: {'204': {description: deleted}}
  /debug/config:
    get:
      summary: Dump config
      deprecated: true
      security: [{}]
      responses: {'200': {description: config}}
  /files:
    get:
      summary: Download file
      security: [{apiKey: []}]
      parameters: [{name: path, in: query, required: true, schema: {type: string}}]
      responses: {'200': {description: file}}
